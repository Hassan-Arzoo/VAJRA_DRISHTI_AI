<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1120" viewBox="0 0 1920 1120" role="img" aria-labelledby="title desc">
  <title id="title">VajraDrishti AI system architecture</title>
  <desc id="desc">Target multimodal architecture with observation sources, preprocessing, deep and tabular model branches, fusion, probability outputs, API deployment and WebGIS. A separate band identifies the current synthetic-data proof of concept.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f5f8fc"/><stop offset="1" stop-color="#eaf0f7"/></linearGradient>
    <linearGradient id="navy" x2="1" y2="1"><stop stop-color="#102c50"/><stop offset="1" stop-color="#1a4771"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17334e" flood-opacity=".13"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L10 6L1 11" fill="none" stroke="#5980a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L10 6L1 11" fill="none" stroke="#168b70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#182b40}.title{font-size:35px;font-weight:800;letter-spacing:.3px;fill:#fff}.subtitle{font-size:17px;fill:#c5d7e9}.tag{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#d5e5f5}.stage{font-size:18px;font-weight:800;fill:#18314d}.num{font-size:15px;font-weight:800;fill:#fff}.boxhead{font-size:15px;font-weight:750;fill:#193552}.body{font-size:13px;fill:#4b6074}.small{font-size:11.5px;fill:#65798d}.white{fill:#fff}.green{fill:#087b64}.blue{fill:#176ab1}.purple{fill:#6741b8}.orange{fill:#a35b09}.muted{fill:#75899c}
    </style>
  </defs>
  <rect width="1920" height="1120" rx="24" fill="url(#bg)"/>
  <rect x="28" y="22" width="1864" height="98" rx="19" fill="url(#navy)"/>
  <text x="960" y="65" text-anchor="middle" class="title">VajraDrishti AI — System Architecture</text>
  <text x="960" y="94" text-anchor="middle" class="subtitle">End-to-End Multimodal Thunderstorm &amp; Lightning Nowcasting · PS 26072</text>
  <rect x="1594" y="38" width="263" height="30" rx="15" fill="#ffffff" fill-opacity=".13"/>
  <text x="1725" y="58" text-anchor="middle" class="tag">TARGET / FUTURE ARCHITECTURE</text>

  <!-- stage cards -->
  <g filter="url(#shadow)">
    <rect x="28" y="145" width="252" height="716" rx="17" fill="#fff" stroke="#b8d4ed" stroke-width="2"/>
    <rect x="294" y="145" width="275" height="716" rx="17" fill="#fff" stroke="#b8e2d3" stroke-width="2"/>
    <rect x="583" y="145" width="485" height="716" rx="17" fill="#fff" stroke="#f1c8d3" stroke-width="2"/>
    <rect x="1082" y="145" width="218" height="716" rx="17" fill="#fff" stroke="#d5c7f4" stroke-width="2"/>
    <rect x="1314" y="145" width="250" height="716" rx="17" fill="#fff" stroke="#b9d9f4" stroke-width="2"/>
    <rect x="1578" y="145" width="314" height="716" rx="17" fill="#fff" stroke="#bfe3d2" stroke-width="2"/>
  </g>

  <!-- stage headings -->
  <g><circle cx="55" cy="178" r="17" fill="#2587d1"/><text x="55" y="184" text-anchor="middle" class="num">1</text><text x="82" y="184" class="stage">DATA SOURCES</text></g>
  <g><circle cx="321" cy="178" r="17" fill="#179572"/><text x="321" y="184" text-anchor="middle" class="num">2</text><text x="348" y="177" class="stage">INGESTION &amp;</text><text x="348" y="199" class="stage">PREPROCESSING</text></g>
  <g><circle cx="610" cy="178" r="17" fill="#d44772"/><text x="610" y="184" text-anchor="middle" class="num">3</text><text x="637" y="184" class="stage">AI MODEL BRANCHES</text></g>
  <g><circle cx="1109" cy="178" r="17" fill="#8054d4"/><text x="1109" y="184" text-anchor="middle" class="num">4</text><text x="1136" y="177" class="stage">MULTIMODAL</text><text x="1136" y="199" class="stage">FUSION</text></g>
  <g><circle cx="1341" cy="178" r="17" fill="#2587d1"/><text x="1341" y="184" text-anchor="middle" class="num">5</text><text x="1368" y="177" class="stage">PREDICTION</text><text x="1368" y="199" class="stage">OUTPUT</text></g>
  <g><circle cx="1605" cy="178" r="17" fill="#179572"/><text x="1605" y="184" text-anchor="middle" class="num">6</text><text x="1632" y="177" class="stage">SERVING &amp;</text><text x="1632" y="199" class="stage">USER LAYER</text></g>

  <!-- source cards -->
  <g>
    <rect x="43" y="220" width="222" height="135" rx="12" fill="#edf6fd" stroke="#d0e3f3"/><text x="61" y="251" class="boxhead">Radar</text><text x="61" y="278" class="body">• IMD DWR reflectivity / Max-Z</text><text x="61" y="300" class="body">• Echo intensity and motion</text><text x="61" y="322" class="small">Direct storm-structure signal</text>
    <rect x="43" y="369" width="222" height="135" rx="12" fill="#edf6fd" stroke="#d0e3f3"/><text x="61" y="400" class="boxhead">Satellite</text><text x="61" y="427" class="body">• INSAT-3D / 3DR products</text><text x="61" y="449" class="body">• Cloud and brightness features</text><text x="61" y="471" class="small">Wide-area cloud-top context</text>
    <rect x="43" y="518" width="222" height="135" rx="12" fill="#edf6fd" stroke="#d0e3f3"/><text x="61" y="549" class="boxhead">Lightning</text><text x="61" y="576" class="body">• Flash count, density, trends</text><text x="61" y="598" class="body">• Approved observations/feed</text><text x="61" y="620" class="small">Recent electrical activity</text>
    <rect x="43" y="667" width="222" height="174" rx="12" fill="#edf6fd" stroke="#d0e3f3"/><text x="61" y="699" class="boxhead">Atmospheric / Model</text><text x="61" y="726" class="body">• ERA5 initially; NWP later</text><text x="61" y="748" class="body">• Temperature and humidity</text><text x="61" y="770" class="body">• Wind and pressure</text><text x="61" y="807" class="small">Environmental context</text>
  </g>

  <!-- preprocess -->
  <g>
    <rect x="309" y="220" width="245" height="88" rx="11" fill="#eff9f5" stroke="#d1eee2"/><text x="326" y="249" class="boxhead">Ingestion &amp; metadata</text><text x="326" y="274" class="body">Timestamp · location · source · raw data</text>
    <rect x="309" y="320" width="245" height="88" rx="11" fill="#eff9f5" stroke="#d1eee2"/><text x="326" y="349" class="boxhead">Quality control</text><text x="326" y="374" class="body">Invalid values · quality flags · missingness</text>
    <rect x="309" y="420" width="245" height="88" rx="11" fill="#eff9f5" stroke="#d1eee2"/><text x="326" y="449" class="boxhead">Georeferencing</text><text x="326" y="474" class="body">Common coordinate and study-area grid</text>
    <rect x="309" y="520" width="245" height="88" rx="11" fill="#eff9f5" stroke="#d1eee2"/><text x="326" y="549" class="boxhead">Temporal alignment</text><text x="326" y="574" class="body">5-minute reference · no future data</text>
    <rect x="309" y="620" width="245" height="88" rx="11" fill="#eff9f5" stroke="#d1eee2"/><text x="326" y="649" class="boxhead">Spatial alignment</text><text x="326" y="674" class="body">Regrid fields · aggregate lightning cells</text>
    <rect x="309" y="720" width="245" height="121" rx="11" fill="#eff9f5" stroke="#d1eee2"/><text x="326" y="750" class="boxhead">Feature engineering</text><text x="326" y="776" class="body">Sequences · tabular features · availability</text><text x="326" y="800" class="small">Common multimodal representation</text>
  </g>

  <!-- model branches -->
  <g>
    <rect x="599" y="220" width="453" height="272" rx="13" fill="#fff5f7" stroke="#f0d5df"/>
    <text x="620" y="251" class="boxhead" fill="#9b294e">Branch 1 · Spatiotemporal deep model</text>
    <rect x="619" y="271" width="126" height="94" rx="10" fill="#fff" stroke="#e9c2d0"/><text x="682" y="305" text-anchor="middle" class="body">Radar + satellite</text><text x="682" y="328" text-anchor="middle" class="small">image sequences</text><text x="682" y="347" text-anchor="middle" class="small">past 30–60 min</text>
    <path d="M748 318h28" stroke="#b34c70" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="784" y="271" width="116" height="94" rx="10" fill="#fff" stroke="#e9c2d0"/><text x="842" y="305" text-anchor="middle" class="boxhead">ConvLSTM</text><text x="842" y="328" text-anchor="middle" class="small">baseline model</text><text x="842" y="347" text-anchor="middle" class="small">Earthformer optional</text>
    <path d="M903 318h27" stroke="#b34c70" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="939" y="271" width="94" height="94" rx="10" fill="#fff" stroke="#e9c2d0"/><text x="986" y="304" text-anchor="middle" class="body">Future</text><text x="986" y="326" text-anchor="middle" class="body">spatial</text><text x="986" y="348" text-anchor="middle" class="body">hazard field</text>
    <text x="620" y="405" class="small">Produces a spatiotemporal representation from gridded sequences.</text>
    <rect x="599" y="509" width="453" height="332" rx="13" fill="#fff8eb" stroke="#eedbb9"/>
    <text x="620" y="541" class="boxhead" fill="#8d560b">Branch 2 · Tabular / event model</text>
    <rect x="619" y="562" width="203" height="53" rx="9" fill="#fff" stroke="#efdfc2"/><text x="635" y="584" class="body">Lightning statistics</text><text x="635" y="603" class="small">counts · density · recent trend</text>
    <rect x="619" y="623" width="203" height="53" rx="9" fill="#fff" stroke="#efdfc2"/><text x="635" y="645" class="body">Satellite and radar features</text><text x="635" y="664" class="small">cloud · intensity · texture · motion</text>
    <rect x="619" y="684" width="203" height="53" rx="9" fill="#fff" stroke="#efdfc2"/><text x="635" y="706" class="body">Atmospheric variables</text><text x="635" y="725" class="small">temperature · humidity · wind · pressure</text>
    <rect x="844" y="581" width="186" height="103" rx="12" fill="#fff" stroke="#e6cfaa"/><text x="937" y="617" text-anchor="middle" class="boxhead">LightGBM / XGBoost</text><text x="937" y="642" text-anchor="middle" class="small">Feature-based prediction</text><text x="937" y="663" text-anchor="middle" class="small">Random Forest in current PoC</text>
    <path d="M824 649h15" stroke="#bd7c28" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="620" y="777" class="small">Outputs target-event probabilities at each forecast horizon.</text>
  </g>

  <!-- fusion -->
  <g>
    <rect x="1099" y="230" width="184" height="160" rx="13" fill="#f5f0ff" stroke="#e2d7f6"/>
    <circle cx="1191" cy="280" r="24" fill="#e7dcff"/><path d="M1179 282l9-12 7 8 10-11" fill="none" stroke="#7048c6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1191" y="329" text-anchor="middle" class="boxhead">Feature / prediction</text><text x="1191" y="350" text-anchor="middle" class="boxhead">fusion</text><text x="1191" y="374" text-anchor="middle" class="small">source availability flags</text>
    <path d="M1054 410h39" stroke="#8a65ce" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="1099" y="426" width="184" height="151" rx="13" fill="#f5f0ff" stroke="#e2d7f6"/>
    <circle cx="1191" cy="468" r="22" fill="#e7dcff"/><path d="M1179 475v-12m12 12v-22m12 22v-17" stroke="#7048c6" stroke-width="4" stroke-linecap="round"/>
    <text x="1191" y="516" text-anchor="middle" class="boxhead">Calibrated classifier</text><text x="1191" y="540" text-anchor="middle" class="small">future extension</text><text x="1191" y="560" text-anchor="middle" class="small">PoC uses baseline outputs</text>
    <rect x="1099" y="613" width="184" height="207" rx="13" fill="#f5f0ff" stroke="#e2d7f6"/>
    <circle cx="1191" cy="663" r="24" fill="#e7dcff"/><circle cx="1191" cy="663" r="14" fill="none" stroke="#7048c6" stroke-width="3"/><path d="M1191 653v11l8 5" fill="none" stroke="#7048c6" stroke-width="3" stroke-linecap="round"/>
    <text x="1191" y="715" text-anchor="middle" class="boxhead">Multi-horizon</text><text x="1191" y="738" text-anchor="middle" class="boxhead">prediction</text><text x="1191" y="775" text-anchor="middle" class="body">+5 / +10 / +15</text><text x="1191" y="797" text-anchor="middle" class="body">+30 / +60 minutes</text>
    <path d="M1191 392v27" stroke="#8a65ce" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1191 579v26" stroke="#8a65ce" stroke-width="2.5" marker-end="url(#arrow)"/>
  </g>

  <!-- prediction outputs -->
  <g>
    <rect x="1331" y="230" width="216" height="123" rx="13" fill="#f1f8fe" stroke="#d5e8f6"/><text x="1350" y="263" class="boxhead">Lightning probability</text><text x="1350" y="292" class="body">0–1 estimate · selected horizon</text><rect x="1350" y="311" width="178" height="12" rx="6" fill="#dce9f3"/><rect x="1350" y="311" width="104" height="12" rx="6" fill="#3395cb"/>
    <rect x="1331" y="369" width="216" height="123" rx="13" fill="#f1f8fe" stroke="#d5e8f6"/><text x="1350" y="402" class="boxhead">Thunderstorm / hazard</text><text x="1350" y="431" class="body">0–1 estimate · selected horizon</text><rect x="1350" y="450" width="178" height="12" rx="6" fill="#dce9f3"/><rect x="1350" y="450" width="82" height="12" rx="6" fill="#e5a348"/>
    <rect x="1331" y="508" width="216" height="113" rx="13" fill="#f1f8fe" stroke="#d5e8f6"/><text x="1350" y="541" class="boxhead">Confidence &amp; availability</text><text x="1350" y="570" class="body">Source status · quality flags</text><text x="1350" y="594" class="small">Not a validated skill score</text>
    <rect x="1331" y="637" width="216" height="183" rx="13" fill="#f1f8fe" stroke="#d5e8f6"/><text x="1350" y="671" class="boxhead">Optional outputs</text><text x="1350" y="704" class="body">• Hazard probability map</text><text x="1350" y="731" class="body">• Storm motion / trajectory</text><text x="1350" y="758" class="body">• Severity visualization</text><text x="1350" y="793" class="small">Requires data and validation</text>
    <path d="M1286 515h39" stroke="#357bb2" stroke-width="2.5" marker-end="url(#arrow)"/>
  </g>

  <!-- serving and user layer -->
  <g>
    <rect x="1595" y="230" width="280" height="145" rx="13" fill="#eff9f4" stroke="#d1eee0"/><text x="1617" y="265" class="boxhead">Trained model serving</text><text x="1617" y="294" class="body">Saved model · version · input checks</text><text x="1617" y="319" class="small">Runtime loads and predicts; it does not train</text>
    <rect x="1595" y="391" width="280" height="126" rx="13" fill="#eff9f4" stroke="#d1eee0"/><text x="1617" y="428" class="boxhead">FastAPI inference service</text><text x="1617" y="457" class="body">Health · sample input · prediction API</text><text x="1617" y="484" class="small">Docker is an optional deployment step</text>
    <rect x="1595" y="533" width="280" height="287" rx="13" fill="#fff8eb" stroke="#eedbb9"/><text x="1617" y="570" class="boxhead">User dashboard</text><rect x="1617" y="591" width="236" height="54" rx="9" fill="#fff" stroke="#efdfc2"/><text x="1632" y="614" class="body">Interactive map / grid layers</text><text x="1632" y="633" class="small">Radar · satellite · lightning · hazard</text><rect x="1617" y="655" width="236" height="54" rx="9" fill="#fff" stroke="#efdfc2"/><text x="1632" y="678" class="body">Replay · horizon · source status</text><text x="1632" y="697" class="small">Confidence and probability view</text><rect x="1617" y="719" width="236" height="74" rx="9" fill="#fff" stroke="#efdfc2"/><text x="1632" y="745" class="body">Current PoC: Streamlit</text><text x="1632" y="770" class="small">Future UI: React + Mapbox WebGIS</text>
    <path d="M1549 450h39" stroke="#168b70" stroke-width="2.5" marker-end="url(#arrowGreen)"/><path d="M1735 378v9" stroke="#168b70" stroke-width="2.5" marker-end="url(#arrowGreen)"/><path d="M1735 520v8" stroke="#168b70" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  </g>

  <!-- engineering principles and explicit PoC scope -->
  <rect x="28" y="884" width="1864" height="205" rx="17" fill="#fff" stroke="#cbd7e4" stroke-width="2"/>
  <text x="54" y="919" class="stage">ENGINEERING PRINCIPLES</text>
  <g>
    <rect x="52" y="940" width="420" height="58" rx="11" fill="#f2f6fa"/><text x="72" y="965" class="boxhead">No data leakage</text><text x="72" y="985" class="small">Past inputs only; future observations stay out of features.</text>
    <rect x="490" y="940" width="420" height="58" rx="11" fill="#f2f6fa"/><text x="510" y="965" class="boxhead">Chronological validation</text><text x="510" y="985" class="small">Train / validation / test split follows time.</text>
    <rect x="928" y="940" width="420" height="58" rx="11" fill="#f2f6fa"/><text x="948" y="965" class="boxhead">Source-aware behavior</text><text x="948" y="985" class="small">Missing inputs are visible and recorded.</text>
    <rect x="1366" y="940" width="500" height="58" rx="11" fill="#f2f6fa"/><text x="1386" y="965" class="boxhead">Honest results</text><text x="1386" y="985" class="small">No performance claim without measured evaluation.</text>
  </g>
  <rect x="52" y="1014" width="1814" height="54" rx="11" fill="#e8f7f2" stroke="#c5e7dc"/>
  <text x="75" y="1047" class="boxhead green">CURRENT PoC</text>
  <text x="235" y="1047" class="body">Synthetic sample data → preprocessing / features → Random Forest baseline → feature-level fusion → FastAPI → interactive Streamlit dashboard.</text>
  <text x="1856" y="1099" text-anchor="end" class="small">Target diagram shows extension points; real data, ConvLSTM, calibration and WebGIS are future work.</text>
</svg>
